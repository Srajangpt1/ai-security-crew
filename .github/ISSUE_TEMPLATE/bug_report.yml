name: "\U0001F41B Bug Report"
description: Create a report to help us improve mcp-security-review
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to fill out this bug report! Please provide as much detail as possible.
  - type: checkboxes
    id: prerequisites
    attributes:
      label: Prerequisites
      description: Please confirm the following before submitting the issue.
      options:
        - label: I have searched the [existing issues](https://github.com/ai-security-crew/mcp-security-review/issues) to make sure this bug has not already been reported.
          required: true
        - label: I have checked the [README](https://github.com/ai-security-crew/mcp-security-review/blob/main/README.md) for relevant information.
          required: true
  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: A clear and concise description of what the bug is.
      placeholder: "When I call the `sca_scan_dependencies` tool with..., it fails with..."
    validations:
      required: true
  - type: textarea
    id: steps-to-reproduce
    attributes:
      label: Steps to Reproduce
      description: Provide detailed steps to reproduce the behavior.
      placeholder: |
        1. Start the server with command `...`
        2. Send a `list_tools` request using `...`
        3. Call the tool `xyz` with arguments `...`
        4. See error `...`
    validations:
      required: true
  - type: textarea
    id: expected-behavior
    attributes:
      label: Expected Behavior
      description: A clear and concise description of what you expected to happen.
      placeholder: "I expected the scan to return the known CVEs for the package."
    validations:
      required: true
  - type: textarea
    id: actual-behavior
    attributes:
      label: Actual Behavior
      description: What actually happened? Include full error messages, logs (from the server and the client if possible), or screenshots.
      placeholder: "The server returned an error message: '...' / The tool call returned an empty list."
      render: shell
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: mcp-security-review Version
      description: Which version of `mcp-security-review` are you using? (Check `pip show mcp-security-review` or `pyproject.toml`)
      placeholder: "e.g., 0.6.5"
    validations:
      required: true
  - type: dropdown
    id: installation
    attributes:
      label: Installation Method
      description: How did you install `mcp-security-review`?
      options:
        - From PyPI (pip install mcp-security-review / uv add mcp-security-review)
        - From source (git clone)
        - Docker
        - Other
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating System
      description: What operating system are you using?
      options:
        - Windows
        - macOS
        - Linux (Specify distribution below if relevant)
        - Other
    validations:
      required: true
  - type: input
    id: python-version
    attributes:
      label: Python Version
      description: What version of Python are you using? (`python --version`)
      placeholder: "e.g., 3.11.4"
    validations:
      required: true
  - type: input
    id: client-app
    attributes:
      label: Client Application
      description: What application/library are you using to interact with the MCP server? (This is important!)
      placeholder: "e.g., Cursor, LangChain, custom script, Inspector Tool"
    validations:
      required: true
  - type: textarea
    id: additional-context
    attributes:
      label: Additional Context
      description: Add any other context about the problem here (e.g., environment variables, network configuration like proxies).
