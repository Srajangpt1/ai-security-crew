model = "o4"

[mcp_servers.context7]
command = "npx"
args = ["-y", "@upstash/context7-mcp"]
env = { "CONTEXT7_KEY" = "SECRET-VALUE" }
env_vars = ["PATH_HINT"]

[mcp_servers.figma]
url = "https://figma.example.com/mcp"
bearer_token_env_var = "FIGMA_TOKEN"
http_headers = { "X-Team" = "SECRET-VALUE" }
